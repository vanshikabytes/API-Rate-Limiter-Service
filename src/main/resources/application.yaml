spring:
  application:
    name: api-rate-limiter-service

server:
  port: 8080

# ─────────────────────────────────────────────────────────────
# RATE LIMITER CONFIGURATION — Step 5 Revision
# ─────────────────────────────────────────────────────────────
# capacity:   Maximum number of tokens in the bucket.
# ─────────────────────────────────────────────────────────────
rate-limiter:
  # Existing base blocks
  user:
    capacity: 10
    refillTokens: 10
    windowSeconds: 60
  ip:
    capacity: 5
    refillTokens: 5
    windowSeconds: 60
  # backend:
  #   capacity: 20
  #   refillTokens: 20
  #   windowSeconds: 60
  api-key:
    capacity: 100
    refillTokens: 100
    windowSeconds: 3600

  # limits:
  #   default:
  #     capacity: 5
  #     refillTokens: 5
  #     windowSeconds: 60

  # users:
  #   demo-user:
  #     capacity: 5
  #     refillTokens: 5
  #     windowSeconds: 60

  #   premium-user:
  #     capacity: 100
  #     refillTokens: 100
  #     windowSeconds: 60

  # NEW: Tiers for User Tier System feature
  tiers:
    free:
      capacity: 3
      refillTokens: 3
      windowSeconds: 60
    gold:
      capacity: 10
      refillTokens: 10
      windowSeconds: 60
    platinum:
      capacity: 50
      refillTokens: 50
      windowSeconds: 60

# ─────────────────────────────────────────────────────────────
# ACTUATOR CONFIGURATION 
# ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
