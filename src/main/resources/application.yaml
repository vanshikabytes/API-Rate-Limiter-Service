spring:
  application:
    name: api-rate-limiter-service

  # ─────────────────────────────────────────────────────────────
  # REDIS — Centralized store for distributed rate limiting.
  # When the 'local' profile is active, the app uses
  # InMemoryBucketRepository and these settings are ignored.
  # ─────────────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      # Lettuce pool settings — keeps connections warm and avoids
      # per-request connect overhead.
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

server:
  port: 8080

# ─────────────────────────────────────────────────────────────
# RATE LIMITER CONFIGURATION
# ─────────────────────────────────────────────────────────────
# capacity:      Maximum tokens in the bucket.
# refillRate:    Tokens added over one windowSeconds period.
# windowSeconds: Duration of the rate limit window.
# ─────────────────────────────────────────────────────────────
rate-limiter:
  limits:
    default:
      capacity: 5
      refillRate: 5
      windowSeconds: 60

  users:
    demo-user:
      capacity: 5
      refillRate: 5
      windowSeconds: 60

    premium-user:
      capacity: 100
      refillRate: 100
      windowSeconds: 60

# ─────────────────────────────────────────────────────────────
# ACTUATOR
# ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
