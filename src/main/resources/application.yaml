spring:
  application:
    name: api-rate-limiter-service
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

# ─────────────────────────────────────────────────────────────
# RATE LIMITER CONFIGURATION — Phase 2
# ─────────────────────────────────────────────────────────────
# storage: "memory"  → InMemoryBucketRepository (default, no Redis needed)
#          "redis"   → RedisBucketRepository    (distributed, requires Redis)
# ─────────────────────────────────────────────────────────────
rate-limiter:
  storage: redis   # ← change to "redis" to enable distributed mode

  # ── Prefix-based fallback limits ──────────────────────────
  user:
    capacity: 10
    refillTokens: 10
    windowSeconds: 60

  ip:
    capacity: 5
    refillTokens: 5
    windowSeconds: 60

  backend:
    capacity: 20
    refillTokens: 20
    windowSeconds: 60

  api-key:
    capacity: 100
    refillTokens: 100
    windowSeconds: 3600

  # ── Phase 2: Tiered limits ────────────────────────────────
  # FREE:       3  req / 60 s  — most restrictive, default for new / expired users
  # PRO:        50 req / 60 s  — standard paid tier
  # ENTERPRISE: 200 req / 60 s — high-volume business clients
  # UNLIMITED:  10 000 req / 60 s — internal services / premium partners
  tiers:
    FREE:
      capacity: 3
      refillTokens: 3
      windowSeconds: 60
    PRO:
      capacity: 50
      refillTokens: 50
      windowSeconds: 60
    ENTERPRISE:
      capacity: 200
      refillTokens: 200
      windowSeconds: 60
    UNLIMITED:
      capacity: 10000
      refillTokens: 10000
      windowSeconds: 60

# ─────────────────────────────────────────────────────────────
# ACTUATOR CONFIGURATION
# ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
