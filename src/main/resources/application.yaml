spring:
  application:
    name: api-rate-limiter-service

server:
  port: 8080

# ─────────────────────────────────────────────────────────────
# RATE LIMITER CONFIGURATION — Step 5 Revision
# ─────────────────────────────────────────────────────────────
# capacity:   Maximum number of tokens in the bucket.
# refillRate: Tokens added per second.
# ─────────────────────────────────────────────────────────────
rate-limiter:
  limits:
    default:
      capacity: 5
      refillRate: 5
      windowSeconds: 60

  users:
    demo-user:
      capacity: 5
      refillRate: 5
      windowSeconds: 60

    premium-user:
      capacity: 100
      refillRate: 100
      windowSeconds: 60

# ─────────────────────────────────────────────────────────────
# ACTUATOR CONFIGURATION — Step 7 Polish
# ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
