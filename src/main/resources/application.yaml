spring:
  application:
    name: api-rate-limiter-service

server:
  port: 8080

# ─────────────────────────────────────────────────────────────
# RATE LIMITER CONFIGURATION — Step 5 Revision
# ─────────────────────────────────────────────────────────────
# capacity:   Maximum number of tokens in the bucket.
# refillRate: Tokens added per second.
# ─────────────────────────────────────────────────────────────
rate-limiter:
  limits:
    user:
      capacity: 5
      refillRate: 1
    
    ip:
      capacity: 20
      refillRate: 5
    
    backend:
      capacity: 100
      refillRate: 10

# ─────────────────────────────────────────────────────────────
# ACTUATOR CONFIGURATION — Step 7 Polish
# ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
