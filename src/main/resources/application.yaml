spring:
  application:
    name: API-Rate-Limiter-Service
  data:
    redis:
      # Local Standalone Development
      host: localhost
      port: 6379
      # Note: Command timeout is configured directly via Lettuce in RedisConfig.java
      # This ensures the 2-second timeout is enforced on every Redis command,
      # not just the initial connection handshake.

      # -----------------------------------------------------
      # PRODUCTION DEPLOYMENT: REDIS CLUSTER
      # To deploy this API to production, simply comment out the
      # host/port above, and uncomment this cluster section.
      # The Token Reservation Lua scripts are 100% cluster-compatible
      # because they use {userId} Hash Tags to ensure atomic execution.
      # -----------------------------------------------------
      # cluster:
      #   nodes:
      #     - redis-node-1:6379
      #     - redis-node-2:6379
      #     - redis-node-3:6379
      #     - redis-node-4:6379
      #     - redis-node-5:6379
      #     - redis-node-6:6379

server:
  port: 8080

# ─────────────────────────────────────────────────────────────
# RATE LIMITER CONFIGURATION — Phase 2 (Redis + Tier Rename)
# ─────────────────────────────────────────────────────────────
# storage: 'redis' uses Redis/Memurai; 'local' uses ConcurrentHashMap
# capacity: Maximum number of tokens in the bucket.
# ─────────────────────────────────────────────────────────────
rate-limiter:
  storage: redis

  # Existing base blocks (prefix-based fallback)
  user:
    capacity: 10
    refillTokens: 10
    windowSeconds: 60
  ip:
    capacity: 5
    refillTokens: 5
    windowSeconds: 60
  # backend:
  #   capacity: 20
  #   refillTokens: 20
  #   windowSeconds: 60
  api-key:
    capacity: 100
    refillTokens: 100
    windowSeconds: 3600

  # limits:
  #   default:
  #     capacity: 5
  #     refillTokens: 5
  #     windowSeconds: 60

  # users:
  #   demo-user:
  #     capacity: 5
  #     refillTokens: 5
  #     windowSeconds: 60

  #   premium-user:
  #     capacity: 100
  #     refillTokens: 100
  #     windowSeconds: 60

  # Tiers for User Tier System feature (Phase 2)
  tiers:
    free:
      capacity: 3
      refillTokens: 3
      windowSeconds: 60
    pro:
      capacity: 5
      refillTokens: 5
      windowSeconds: 60
    enterprise:
      capacity: 10
      refillTokens: 10
      windowSeconds: 120
    unlimited:
      capacity: 20
      refillTokens: 20
      windowSeconds: 120

# ─────────────────────────────────────────────────────────────
# ACTUATOR CONFIGURATION
# ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
